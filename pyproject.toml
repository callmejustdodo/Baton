[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baton"
version = "0.1.0"
description = "Snapshot a Codex session and its workspace for a remote handoff."
requires-python = ">=3.11"
dependencies = [
    "modal>=1.5.4",
]

[project.scripts]
baton = "baton.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
